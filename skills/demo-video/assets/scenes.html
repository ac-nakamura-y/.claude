<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>動作確認</title>
<!--
  画面を持たない処理（API・ワークフロー・バッチ・エージェント）を見せるための土台。
  このファイルを scratchpad の作業ディレクトリへコピーし、同じ場所に data.js を置く。

  window.DATA = {
    title, context, condition,          // 表紙
    input,                              // 1. 入力（任意の JSON）
    timeline: [{ t: 秒, msg }],         // 経過。msg に「完了」「done」を含む行は緑、「失敗」「エラー」「error」は赤
    notification,                       // 通知の文面（Slack・メールなどに届く文）
    output,                             // 結果（任意の JSON）
    image,                              // 成果物の画像（data.js からの相対パス）。幅 560px の枠に収まる
  };

  シナリオからは show(n) で n 番目（0 始まり、並び順）の面に切り替え、await playTimeline(ms) で経過を流し、
  await scrollShot() で成果物の画像を上から下へ送る。面は <section class="scene"> を足し引きするだけでよい。
-->
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --fg:#e8eaee; --mute:#9aa1ad; --ok:#3fb950; --ng:#f85149; --warn:#d29922; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.6 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif; }
  .scene { display:none; position:absolute; inset:0; padding:28px 48px; overflow:hidden; }
  .scene.on { display:block; }
  h1 { font-size:36px; margin:0 0 8px; }
  h2 { font-size:22px; margin:0 0 16px; }
  .sub { color:var(--mute); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 20px; word-break:break-all; }
  pre { margin:0; white-space:pre-wrap; font:13px/1.55 "SF Mono",Menlo,monospace; }
  .ok { color:var(--ok); } .ng { color:var(--ng); } .warn { color:var(--warn); }
  .clock { font-size:46px; font-weight:800; font-variant-numeric:tabular-nums; }
  .log { height:540px; display:flex; flex-direction:column; justify-content:flex-end; overflow:hidden; font:13.5px/1.6 "SF Mono",Menlo,monospace; }
  .log .t { color:var(--mute); display:inline-block; width:70px; }
  .shot { height:600px; width:560px; overflow:hidden; border-radius:8px; border:1px solid var(--line); background:#fff; }
  .shot img { width:100%; display:block; transition:transform 9s linear; }
</style>
</head>
<body>
<section class="scene">
  <div style="position:absolute;top:50%;transform:translateY(-55%)">
    <p class="sub" id="context"></p>
    <h1 id="title"></h1>
    <p class="sub" id="condition"></p>
  </div>
</section>
<section class="scene"><h2>入力</h2><div class="panel"><pre id="input"></pre></div></section>
<section class="scene"><h2>経過</h2>
  <div style="display:grid;grid-template-columns:280px 1fr;gap:18px">
    <div class="panel"><div class="sub">経過（実時間）</div><div class="clock" id="clock">0.0s</div><div class="sub" id="speed"></div></div>
    <div class="panel log" id="log"></div>
  </div>
</section>
<section class="scene"><h2>通知</h2><div class="panel"><pre id="notification" style="font:15px/1.7 'Hiragino Sans',sans-serif"></pre></div></section>
<section class="scene"><h2>結果</h2><div class="panel"><pre id="output"></pre></div></section>
<section class="scene"><h2>成果物</h2><div class="shot"><img id="image" alt=""></div></section>
<script src="data.js"></script>
<script>
  const D = window.DATA;
  const $ = (id) => document.getElementById(id);
  $("context").textContent = D.context ?? "";
  $("title").textContent = D.title;
  $("condition").textContent = D.condition ?? "";
  $("input").textContent = JSON.stringify(D.input, null, 2);
  $("notification").textContent = D.notification ?? "";
  $("output").textContent = JSON.stringify(D.output, null, 2);
  if (D.image) $("image").src = D.image;

  window.show = (n) => document.querySelectorAll(".scene").forEach((s, i) => s.classList.toggle("on", i === n));

  // 記録した経過を ms ミリ秒かけて流す。時計は実時間の秒数を示す。流し終えると解決する
  window.playTimeline = (ms) => new Promise((done) => {
    const events = D.timeline ?? [];
    const total = events.at(-1)?.t ?? 0;
    const start = performance.now();
    let i = 0;
    const rate = total / (ms / 1000);
    $("speed").textContent = rate > 1.05 ? `${rate.toFixed(rate < 10 ? 1 : 0)} 倍速で再生` : "";
    const tick = () => {
      const t = Math.min(total, ((performance.now() - start) / ms) * total);
      $("clock").textContent = `${t.toFixed(1)}s`;
      while (i < events.length && events[i].t <= t) {
        const e = events[i++];
        const row = document.createElement("div");
        const time = document.createElement("span");
        time.className = "t";
        time.textContent = `${e.t.toFixed(1)}s`;
        const msg = document.createElement("span");
        msg.className = /失敗|エラー|error/i.test(e.msg) ? "ng" : /完了|done/i.test(e.msg) ? "ok" : "";
        msg.textContent = e.msg;
        row.append(time, msg);
        $("log").append(row);
      }
      t < total ? requestAnimationFrame(tick) : done();
    };
    tick();
  });

  // 縦に長い画像（メール HTML のスクリーンショットなど）を、枠の中で上から下へ 9 秒かけて送る。
  // 成果物の面を表示してから呼ぶ。送り終えると解決する（枠に収まる画像なら送らずに解決する）
  window.scrollShot = async () => {
    const img = $("image");
    await img.decode();
    const distance = Math.max(0, img.height - img.parentElement.clientHeight);
    if (distance === 0) return;
    img.style.transform = `translateY(-${distance}px)`;
    await new Promise((done) => img.addEventListener("transitionend", done, { once: true }));
  };

  show(0);
</script>
</body>
</html>
